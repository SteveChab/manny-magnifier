# Builds the Android app on every push. This cannot replace the Appium suite (that needs a
# real device) but it catches the failures that have actually bitten this project: a plugin
# version drifting past its patch file, a Gradle/SDK mismatch, or a release-only ProGuard break.
name: Android build

on:
  push:
    branches: ["main", "chore/**", "fix/**", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: native/.nvmrc
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Install native dependencies
        working-directory: native
        # `npm ci` runs the patch-package postinstall. If a patch no longer applies to the
        # pinned version, this step fails here rather than in a release build.
        run: npm ci

      - name: Stage web assets and sync Capacitor (Android only)
        working-directory: native
        # iOS is skipped deliberately: pod install needs macOS.
        run: |
          mkdir -p www
          cp ../app/index.html ../app/mmagnifier-logo.svg www/
          npx cap sync android

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release bundle
        working-directory: native/android
        # Exercises lintVitalRelease and the full ProGuard path — where release-only breakage hides.
        run: ./gradlew bundleRelease --no-daemon

      - name: Assert Play's target-API requirement is still met
        working-directory: native/android
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)
          TARGET=$("$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk \
                   | grep -o "targetSdkVersion:'[0-9]*'" | grep -o "[0-9]*")
          echo "targetSdkVersion = $TARGET"
          if [ "$TARGET" -lt 36 ]; then
            echo "::error::targetSdk $TARGET is below 36 — Google Play rejects new apps under 36 (since 31 Aug 2026)"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            native/android/app/build/outputs/apk/debug/app-debug.apk
            native/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
